<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serviços</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Portal de Serviços de Informática</h1>
        <p>Conheça nossos serviços.</p>
    </header>

    <nav aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="servicos.html" aria-current="page">Serviços</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>

        <section>

            <h2>Serviços disponíveis</h2>

            <p>
                Veja alguns dos serviços oferecidos.
            </p>

            <label for="filtroCategoria">Filtrar serviços por categoria:</label>
            <select id="filtroCategoria" aria-controls="listaServicos">
                <option value="todos">Todos os serviços</option>
                <option value="software">Software</option>
                <option value="hardware">Hardware</option>
                <option value="atendimento">Atendimento</option>
            </select>
            <p id="mensagemFiltro" aria-live="polite"></p>
            <div id="listaServicos" class="lista-servicos"></div>
            <noscript>Ative o JavaScript para visualizar e filtrar o catálogo de serviços.</noscript>
        </section>

    </main>

    <footer>
        <p>Projeto acadêmico - Programação Web</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
