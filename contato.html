```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Portal de Serviços de Informática</h1>
        <p>Entre em contato conosco.</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>

        <section>

            <h2>Entre em contato</h2>

            <p>
                Preencha os campos abaixo para solicitar informações.
            </p>

            <form>

                <label for="nome">Nome:</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <label for="email">E-mail:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="servico">Escolha um serviço:</label>

                <select id="servico" name="servico" required>

                    <option value="">Selecione</option>
                    <option value="formatacao">Formatação</option>
                    <option value="manutencao">Manutenção</option>
                    <option value="programas">Instalação de programas</option>

                </select>

                <label for="mensagem">Mensagem:</label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="5"
                    required
                ></textarea>

                <button id="btnConsultar" type="button">
                    Consultar
                </button>

                <p id="resultado" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>Projeto acadêmico - Programação Web</p>
    </footer>

</body>

</html>
```
