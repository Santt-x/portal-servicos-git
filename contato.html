<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Portal de Serviços de Informática</h1>
        <p>Entre em contato conosco.</p>
    </header>

    <nav aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html" aria-current="page">Contato</a>
    </nav>

    <main>

        <section>

            <h2>Entre em contato</h2>

            <p>
                Preencha os campos abaixo para solicitar informações.
            </p>

            <form id="formContato">

                <label for="nome">Nome:</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    required
                >

                <label for="email">E-mail:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="servico">Escolha um serviço:</label>

                <select id="servico" name="servico" required>

                    <option value="">Selecione</option>
                    <option value="formatacao">Formatação</option>
                    <option value="manutencao">Manutenção</option>
                    <option value="programas">Instalação de programas</option>

                </select>

                <label for="mensagem">Mensagem:</label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="5"
                    required
                ></textarea>

                <button type="submit">Enviar solicitação</button>
                <p id="mensagemForm" aria-live="polite"></p>
                <p>A confirmação é local: este portal acadêmico não envia dados a um servidor.</p>

                <button id="btnConsultar" type="button">
                    Consultar
                </button>

                <p id="resultado" aria-live="polite"></p>

            </form>

        </section>

        <section class="preferencia" aria-labelledby="tituloFavorito">
            <h2 id="tituloFavorito">Meu serviço favorito</h2>
            <label for="servicoFavorito">Escolha seu serviço favorito:</label>
            <select id="servicoFavorito">
                <option value="">Selecione</option>
                <option value="formatacao">Formatação de computadores</option>
                <option value="manutencao">Manutenção de computadores</option>
                <option value="programas">Instalação de programas</option>
            </select>
            <button id="btnSalvarFavorito" type="button">Salvar favorito</button>
            <p id="favoritoSalvo" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>Projeto acadêmico - Programação Web</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
